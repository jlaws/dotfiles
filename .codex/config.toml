project_doc_fallback_filenames = ["CLAUDE.md", ".agents.md"]
project_doc_max_bytes = 65536
model = "gpt-6-astra"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "xhigh"
approvals_reviewer = "auto_review"

[agents]
max_threads = 6
max_depth = 1

# Codex reads hooks either here or in .codex/hooks.json. log-prompt.sh synced from day one but was
# never registered, so it had never fired while its Claude twin was wired the whole time. This
# matches .claude/settings.json, which also registers UserPromptSubmit and nothing else --
# see docs/adr/context-efficiency/hooks-do-not-restate-loaded-guidance.md.
[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "bash ~/.codex/hooks/log-prompt.sh"
timeout = 5

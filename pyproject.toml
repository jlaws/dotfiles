[project]
name = "dotfiles"
version = "0.1.0"
requires-python = ">=3.12"

[dependency-groups]
dev = ["ruff", "ty"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "PIE", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ty.environment]
python-version = "3.12"

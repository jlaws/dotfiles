[project]
name = "dotfiles"
version = "0.1.0"
requires-python = ">=3.12"

[dependency-groups]
dev = ["ruff", "mypy"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "PIE", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
".claude/references/**/*.py" = [
    "F401", "F811", "F821", "E402", "D", "N", "I", "PIE", "RUF",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = [".claude/references/"]

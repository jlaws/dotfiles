description = "Analyze recent conversation history to improve GEMINI.md / CLAUDE.md files -- find violated instructions, missing patterns, and outdated rules. Use when tuning agent behavior or after a batch of sessions. Do NOT use for quick questions (edit files directly instead)."

prompt = '''
Scope: {{args}}

If no arguments provided, analyzes both global and local GEMINI.md against last 20 conversations.

**You may delegate independent analysis passes (per GEMINI.md file or per perspective) to subagents and run them in parallel. Synthesize and verify their output before presenting.**

Load these before analyzing:
- Load the `analysis-output-patterns` skill by reading `~/.agents/skills/analysis-output-patterns/SKILL.md` for output structure rules
- Load the `code-agent-meta-patterns` skill by reading `~/.agents/skills/code-agent-meta-patterns/SKILL.md` -- GEMINI.md design patterns, context budget rules
- Load the `verification-before-completion` skill by reading `~/.agents/skills/verification-before-completion/SKILL.md` -- evidence-before-claims methodology
- Load the `writing-skills` skill by reading `~/.agents/skills/writing-skills/SKILL.md` -- skill creation and testing methodology
- Read `~/.agents/references/workflow/context-efficiency` -- context management patterns
- Read `~/.agents/references/workflow/task-execution-checklists` -- implementation and review checklists

## Review Process

### Step 1: Gather Conversation History
1. Read recent conversation logs (use `{{args}}` to determine scope -- global, local, or N conversations)
2. Identify conversations where Gemini behavior was suboptimal, instructions were violated, or the user had to correct course

### Step 2: Analyze Current GEMINI.md
1. Read the current GEMINI.md file(s) in scope (`~/.gemini/GEMINI.md`, `<project>/GEMINI.md`)
2. For each conversation issue found:
   - Was there an existing instruction that was violated? -> Flag as enforcement gap
   - Was the behavior correct but not documented? -> Flag as missing pattern
   - Is there an outdated rule that caused bad behavior? -> Flag as stale rule

### Step 3: Multi-Perspective Review
Analyze from each perspective (inline, or delegated in parallel per the note above):

**3.1 Instruction Compliance**
- Which GEMINI.md rules were violated in recent conversations?
- Are instructions clear enough to follow, or ambiguous?
- Are there conflicting instructions?

**3.2 Missing Patterns**
- What corrections did the user make that aren't captured in GEMINI.md?
- What successful behaviors should be codified?
- What edge cases caused confusion?

**3.3 Staleness Audit**
- Which rules reference tools, files, or patterns that no longer exist?
- Which rules are redundant with default behavior?
- Which rules are too specific (one-time fix) vs durable?

### Step 4: Produce Recommendations
```markdown
## GEMINI.md Review -- {scope}

### Violations Found
- {rule} -- violated in {N} conversations -- {root cause}

### Missing Patterns
- {pattern} -- observed in {context} -- suggested rule

### Stale Rules
- {rule} -- reason it's stale -- suggested action (remove/update)

### Proposed Changes
1. {specific edit with file:line reference}
```

### Step 5: Implementation
- Present findings to user
- Ask which changes to implement
- Make approved edits to GEMINI.md file(s)
'''
